services:
  prova-pratica-laboratorio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prova-pratica-laboratorio
    # network_mode: none
    volumes:
      - ./src:/app/src
    command: >
      sh -c "javac -encoding UTF-8 -d bin src/siga/*.java && java -cp bin siga.Main"
